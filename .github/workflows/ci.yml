name: CI

on:
  push:
    branches: [master, michal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

jobs:
  # The host-side crates are tested against real tools (vercmp, pacman, e2fsck, sfdisk, fsck.fat), so the
  # job runs in an Arch container where those are the real thing.
  test:
    name: Host tests
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install git (needed before checkout inside the container)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-tests
      # pgp-lite's tests verify real package signatures against the keyring blob built from the pinned
      # archlinux-keyring (needs gpg and the network).
      - name: Build the keyring blob
        run: cargo xtask keyring
      - name: Test
        run: >
          cargo test --release
          -p pgp-lite --features std
          -p pkg -p ext4w -p disk -p initrd -p hostcfg -p archstaller-gui -p loadcore
          -p config -p net -p aurbuild -p xtask

  # Builds the real installer ISO (kernel, boot loaders, payload) and enforces the size budget.
  iso:
    name: Build ISO and check size
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install git (needed before checkout inside the container)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: iso
      - name: Config types are up to date with the Rust schema
        run: cargo xtask gen-luals --check
      - name: Build the ISO
        run: cargo xtask build --out target/archstaller.iso
      - name: Size budget (1 MiB; see sizes.md)
        run: cargo xtask size --limit 1048576
      - name: Checksum
        run: sha256sum target/archstaller.iso | tee target/archstaller.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: archstaller-iso
          path: |
            target/archstaller.iso
            target/archstaller.iso.sha256
          retention-days: 14
          if-no-files-found: error

  # Both firmware paths of the boot loader and the BIOS stages must keep building on their own targets too.
  build-profiles:
    name: Build (large profile)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 45
    steps:
      - name: Install git (needed before checkout inside the container)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: iso-large
      - name: Build with tethering and the large profile
        run: cargo xtask build --profile large --tethering --out target/archstaller-large.iso
      - name: Size budget
        run: cargo xtask size --profile large --limit 2097152

  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Install git (needed before checkout inside the container)
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: rustfmt
        run: cargo fmt --all --check
        continue-on-error: true
      - name: clippy (host-side crates)
        run: >
          cargo clippy --release
          -p hostcfg -p aurbuild -p archstaller-gui -p xtask -p pkg -p pgp-lite -p ext4w -p disk -p initrd
          -- -D warnings
        continue-on-error: true

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Relative links in Markdown resolve
        run: python3 .github/scripts/check-links.py

  # Only on pull requests: AGENTS.md requires OVERVIEW.md to follow every behaviour change. A commit whose
  # message contains [skip-overview] opts out (refactors, comments, tests).
  overview:
    name: OVERVIEW.md follows code changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE...$HEAD")
          echo "$changed"
          code=$(echo "$changed" | grep -E '^(kernel|boot|config|xtask|firstboot|tiny-init|gui|configs|crates)/' || true)
          if [ -z "$code" ]; then echo "No source changes."; exit 0; fi
          if echo "$changed" | grep -qx 'OVERVIEW.md'; then echo "OVERVIEW.md was updated."; exit 0; fi
          if git log --format=%B "$BASE..$HEAD" | grep -qi '\[skip-overview\]'; then echo "Skipped by commit message."; exit 0; fi
          echo "::error title=OVERVIEW.md::Source files changed but OVERVIEW.md did not. AGENTS.md requires OVERVIEW.md to be updated in the same change (add [skip-overview] to a commit message if nothing user-visible changed)."
          exit 1

  # One required status for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [test, iso, build-profiles, docs, overview]
    runs-on: ubuntu-latest
    steps:
      - name: Verify
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": "(failure|cancelled)"'; then exit 1; fi
