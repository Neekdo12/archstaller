name: Label pull requests

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs the base branch's workflow and config; no code from the PR is checked out or run.
      - uses: actions/labeler@v5
        with:
          sync-labels: true
