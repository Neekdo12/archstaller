# archstaller: kind=preset
# Sway (Wayland) with waybar, wofi, foot, NetworkManager, PipeWire and Firefox; ly starts the session. 10 GiB+ disk.
# Needs a GPU with working KMS; in a VM enable 3D acceleration (virtio-gpu with virgl).
schema = 1

[system]
hostname = "sway"
timezone = "Europe/Prague"
locale = "en_US.UTF-8"
keymap = "us"

[install]
mirrors = ["https://geo.mirror.pkgbuild.com/$repo/os/$arch"]

[install.disk]
auto_largest = true
esp_mib = 1024

[packages]
explicit = [
  "base",
  "linux",
  "mkinitcpio",
  "grub",
  "efibootmgr",
  "sudo",
  "nano",
  "ly",
  "linux-firmware",
  # session
  "sway",
  "xorg-xwayland",
  "mesa",
  "polkit",
  # bar, launcher, terminal, notifications (used by the shipped config)
  "waybar",
  "otf-font-awesome",
  "wofi",
  "foot",
  "mako",
  # locking, idle, wallpaper
  "swaylock",
  "swayidle",
  "swaybg",
  # portals (screen sharing, file pickers)
  "xdg-desktop-portal",
  "xdg-desktop-portal-wlr",
  "xdg-desktop-portal-gtk",
  # clipboard, screenshots, brightness and media keys (bound in the shipped config)
  "wl-clipboard",
  "grim",
  "slurp",
  "brightnessctl",
  "playerctl",
  "networkmanager",
  "pipewire",
  "pipewire-pulse",
  "wireplumber",
  "ttf-dejavu",
  "noto-fonts",
  "firefox",
]

[packages.providers]
initramfs = "mkinitcpio"
jack = "pipewire-jack"

[[users]]
name = "passwd_is_passwd"
password_hash = "$6$archstlr$gnUg60P8TrWaKT.8/oW8Iq1kc8LlPnk4A6UWw5ij0AAQNe2IN7TuPFnw7PmXMXuobrVIYBSbNWUgRbpafXqcc."
groups = ["wheel"]
shell = "/bin/bash"

[first_boot]
services = [
  "systemd-timesyncd.service",
  "ly@tty2.service",
  "NetworkManager.service",
]

# Writes ~/.config/sway/config for every user (and /etc/skel) unless one is already there.
[[first_boot.scripts]]
id = "sway-config"
file = "sway-config.sh"
