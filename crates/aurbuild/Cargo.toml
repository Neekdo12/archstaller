[package]
name = "aurbuild"
version = "0.1.0"
edition = "2021"
description = "Host side of AUR support: search, review, pin and plan (std only; the build itself happens on the installed system, see docs/aur.md)"

[dependencies]
config = { path = "../../config", features = ["std"] }
pkg = { path = "../pkg" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
ureq = { version = "3", optional = true }

[features]
# Talking to aur.archlinux.org (the GUI and xtask turn it on; the tests of the pure parts do not need it).
net = ["dep:ureq"]
