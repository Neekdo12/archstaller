[package]
name = "drivers"
version = "0.1.0"
edition = "2021"

[dependencies]
hal = { path = "../hal" }
spin = { version = "0.12", default-features = false, features = ["once"] }

[features]
# Each driver is optional so a size-conscious installer build can leave unused ones out
# (`installer_drivers` in the Lua config). All are on by default.
default = ["virtio-blk", "virtio-net", "ahci", "nvme", "e1000", "igb", "r8169", "rtl8139"]
virtio-blk = []
virtio-net = []
ahci = []
nvme = []
e1000 = []
igb = []
r8169 = []
rtl8139 = []
