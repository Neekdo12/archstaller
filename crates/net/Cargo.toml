[package]
name = "net"
version = "0.1.0"
edition = "2021"

[dependencies]
hal = { path = "../hal" }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-dhcpv4", "socket-dns"] }
rustls = { version = "0.23", default-features = false, features = ["hashbrown", "tls12", "custom-provider"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc", "tls12"] }
webpki-roots = "1"
getrandom = { version = "0.2", features = ["custom"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
