[package]
name = "archstaler-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop app to compose an archstaler config, build the ISO and copy it to a Ventoy stick (host only)"

[dependencies]
hostcfg = { path = "../crates/hostcfg", features = ["net"] }
config = { path = "../config", features = ["std"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.15"
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
dirs = "6"
sha2 = "0.10"
serde_json = "1"
