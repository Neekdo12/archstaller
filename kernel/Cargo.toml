[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
config = { path = "../config" }
hal = { path = "../crates/hal" }
drivers = { path = "../crates/drivers", default-features = false }
net = { path = "../crates/net" }
pgp-lite = { path = "../crates/pgp-lite" }
pkg = { path = "../crates/pkg" }
ext4w = { path = "../crates/ext4w" }
disk = { path = "../crates/disk" }
initrd = { path = "../crates/initrd" }
usb = { path = "../crates/usb", optional = true }
imobiledevice = { path = "../crates/imobiledevice", optional = true }
usbnet = { path = "../crates/usbnet", optional = true }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
getrandom = { version = "0.2", features = ["custom"] }
bootinfo = { path = "../crates/bootinfo" }
talc = "5"
spinning_top = "0.3"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[features]
# Installer drivers (see hostcfg's catalogue); all on by default, `xtask` builds with only the
# ones the config's `installer_drivers` lists.
default = ["virtio-blk", "virtio-net", "ahci", "ata", "nvme", "e1000", "igb", "r8169", "rtl8139"]
virtio-blk = ["drivers/virtio-blk"]
virtio-net = ["drivers/virtio-net"]
ahci = ["drivers/ahci"]
ata = ["drivers/ata"]
nvme = ["drivers/nvme"]
e1000 = ["drivers/e1000"]
igb = ["drivers/igb"]
r8169 = ["drivers/r8169"]
rtl8139 = ["drivers/rtl8139"]
# Verbose driver and network tracing (the tester preset always builds with it).
debug = ["hal/debug"]
fault-test = []
disk-selftest = []
net-selftest = []
# Smoke-tests the xHCI driver against QEMU's emulated USB devices; no install happens.
usb-selftest = ["dep:usb"]
# USB tethering as a network source: iPhone (docs/iphone-tethering.md) and Android (RNDIS, CDC-ECM).
usb-tethering = ["dep:usb", "dep:imobiledevice", "dep:usbnet"]
