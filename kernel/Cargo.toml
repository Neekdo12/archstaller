[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
config = { path = "../config" }
hal = { path = "../crates/hal" }
logring = { path = "../crates/logring" }
exfatw = { path = "../crates/exfatw" }
drivers = { path = "../crates/drivers", default-features = false }
net = { path = "../crates/net" }
pgp-lite = { path = "../crates/pgp-lite" }
pkg = { path = "../crates/pkg" }
ext4w = { path = "../crates/ext4w", optional = true }
btrfsw = { path = "../crates/btrfsw", optional = true }
xfsw = { path = "../crates/xfsw", optional = true }
f2fsw = { path = "../crates/f2fsw", optional = true }
disk = { path = "../crates/disk" }
initrd = { path = "../crates/initrd" }
usb = { path = "../crates/usb", optional = true }
imobiledevice = { path = "../crates/imobiledevice", optional = true }
usbnet = { path = "../crates/usbnet", optional = true }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
getrandom = { version = "0.2", features = ["custom"] }
bootinfo = { path = "../crates/bootinfo" }
talc = "5"
spinning_top = "0.3"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[features]
# Installer drivers (see hostcfg's catalogue); all on by default, `xtask` builds with only the
# ones the config's `installer_drivers` lists.
default = ["ext4", "virtio-blk", "virtio-net", "ahci", "ata", "alx", "vmxnet3", "nvme", "e1000", "igb", "r8169", "rtl8139", "e100", "pcnet32"]
ext4 = ["dep:ext4w"]
btrfs = ["dep:btrfsw"]
xfs = ["dep:xfsw"]
f2fs = ["dep:f2fsw"]
all-filesystems = ["ext4", "btrfs", "xfs", "f2fs"]
virtio-blk = ["drivers/virtio-blk"]
virtio-net = ["drivers/virtio-net"]
ahci = ["drivers/ahci"]
ata = ["drivers/ata"]
alx = ["drivers/alx"]
vmxnet3 = ["drivers/vmxnet3"]
nvme = ["drivers/nvme"]
e1000 = ["drivers/e1000"]
igb = ["drivers/igb"]
r8169 = ["drivers/r8169"]
rtl8139 = ["drivers/rtl8139"]
e100 = ["drivers/e100"]
pcnet32 = ["drivers/pcnet32"]
# Verbose driver and network tracing (the tester preset always builds with it).
debug = ["hal/debug"]
fault-test = []
disk-selftest = []
net-selftest = []
# Smoke-tests the xHCI driver against QEMU's emulated USB devices; no install happens.
usb-selftest = ["dep:usb"]
# USB tethering as a network source: iPhone (docs/iphone-tethering.md) and Android (RNDIS, CDC-ECM).
usb-tethering = ["dep:usb", "dep:imobiledevice", "dep:usbnet"]

[lints]
workspace = true
