[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
bootinfo = { path = "../crates/bootinfo" }
config = { path = "../config", features = ["std"] }
hostcfg = { path = "../crates/hostcfg" }
aurbuild = { path = "../crates/aurbuild", features = ["net"] }
sha2 = "0.11"
miniz_oxide = "0.9"
pgp-lite = { path = "../crates/pgp-lite", features = ["std"] }
ext4w = { path = "../crates/ext4w" }
btrfsw = { path = "../crates/btrfsw" }
xfsw = { path = "../crates/xfsw" }
f2fsw = { path = "../crates/f2fsw" }
disk = { path = "../crates/disk" }
initrd = { path = "../crates/initrd" }
pkg = { path = "../crates/pkg" }
drivers = { version = "0.1.0", path = "../crates/drivers" }
usbnet = { version = "0.1.0", path = "../crates/usbnet" }

[lints]
workspace = true
